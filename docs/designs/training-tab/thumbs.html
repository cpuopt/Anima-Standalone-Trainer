<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>Training tab · six candidates</title>
<style>
.dark { --background:#10151f; --foreground:#e0e7f2; --card:#171e2b; --primary:#86aafa; --muted:#1b2434; --muted-foreground:#94a3bb; --accent:#253650; --border:#2b374c; --warn:#e8a25a; }
* { box-sizing:border-box; }
body { margin:0; padding:28px; background:#0b0f16; color:var(--foreground); font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif; }
h1 { font-size:18px; font-weight:650; margin:0 0 4px; } .lead { color:var(--muted-foreground); margin:0 0 22px; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(3,480px); gap:22px; }
figure { margin:0; } figcaption { margin-top:8px; font-size:12px; color:var(--muted-foreground); } figcaption b { color:var(--foreground); font-weight:600; }
.cell { width:480px; height:300px; overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--background); position:relative; }
.mono { font-family:"Cascadia Mono",Consolas,monospace; }
/* 1 · TE faceplate */
.te { display:grid; grid-template-columns:repeat(6,1fr); grid-auto-rows:62px; border-top:1px solid var(--border); border-left:1px solid var(--border); margin:14px; }
.te > div { border-right:1px solid var(--border); border-bottom:1px solid var(--border); padding:7px 9px; position:relative; background:var(--card); }
.te .k { font-size:9px; color:var(--muted-foreground); letter-spacing:.04em; } .te .v { font-family:"Cascadia Mono",Consolas,monospace; font-size:24px; line-height:1.15; }
.te .s2 { grid-column:span 2; } .te .s3 { grid-column:span 3; } .te .r2 { grid-row:span 2; } .te .big .v { font-size:38px; }
.te .bar { position:absolute; left:9px; right:9px; bottom:8px; height:3px; background:var(--muted); } .te .bar i { display:block; height:100%; width:40%; background:var(--primary); }
.sw { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; } .sw span { font-size:9px; border:1px solid var(--border); padding:2px 5px; border-radius:3px; display:flex; gap:4px; align-items:center; } .sw span::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--muted-foreground); } .sw span.on::before { background:var(--primary); box-shadow:0 0 5px var(--primary); }
.lock { position:absolute; right:7px; top:6px; font-size:8px; color:var(--warn); border:1px solid var(--warn); padding:0 4px; border-radius:2px; }
/* 2 · timeline */
.tl { padding:14px 16px; } .tl .recipe { font-size:11px; color:var(--muted-foreground); } .tl .recipe b { color:var(--foreground); font-weight:600; }
.tl svg { display:block; margin:6px 0 8px; } .tl .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; border-top:1px solid var(--border); padding-top:8px; }
.tl .cols h4 { margin:0 0 4px; font-size:10px; font-weight:650; } .tl .cols p { margin:0; font-size:9px; color:var(--muted-foreground); display:flex; justify-content:space-between; border-bottom:1px dotted var(--border); line-height:1.9; } .tl .cols p span { color:var(--foreground); font-family:"Cascadia Mono",Consolas,monospace; }
/* 3 · settings list */
.ls { display:grid; grid-template-columns:110px 1fr; height:100%; } .ls nav { border-right:1px solid var(--border); padding:16px 10px; display:flex; flex-direction:column; gap:3px; font-size:11px; color:var(--muted-foreground); } .ls nav a { padding:5px 8px; border-radius:5px; display:flex; justify-content:space-between; } .ls nav a.on { background:var(--accent); color:var(--foreground); } .ls nav em { font-style:normal; color:var(--primary); font-size:10px; }
.ls .col { padding:14px 18px; } .ls h3 { font-size:12px; margin:0 0 6px; } .ls .grp { border:1px solid var(--border); border-radius:8px; background:var(--card); }
.ls .row { display:flex; justify-content:space-between; align-items:center; padding:7px 10px; border-bottom:1px solid var(--border); gap:10px; } .ls .row:last-child { border:0; } .ls .row.sub { padding-left:24px; background:color-mix(in srgb,var(--muted) 60%,transparent); }
.ls .t { font-size:11px; } .ls .d { font-size:9px; color:var(--muted-foreground); } .ls .mod::before { content:'•'; color:var(--warn); margin-right:4px; }
.seg { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; font-size:9px; } .seg span { padding:3px 7px; } .seg span.on { background:var(--primary); color:#111b32; }
.tog { width:26px; height:15px; border-radius:9px; background:var(--muted); border:1px solid var(--border); position:relative; } .tog::after { content:''; position:absolute; width:11px; height:11px; top:1px; left:1px; border-radius:50%; background:var(--muted-foreground); } .tog.on { background:var(--primary); } .tog.on::after { left:12px; background:#fff; }
.num { font-size:10px; border:1px solid var(--border); border-radius:5px; padding:2px 7px; font-family:"Cascadia Mono",Consolas,monospace; background:var(--background); }
/* 4 · split preview */
.sp { display:grid; grid-template-columns:1fr 1fr; height:100%; } .sp .f { padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; align-content:start; } .sp .f label { font-size:9px; color:var(--muted-foreground); display:block; } .sp .f div div { border:1px solid var(--border); border-radius:5px; font-size:10px; padding:3px 6px; background:var(--card); }
.sp pre { margin:0; padding:14px; background:#0c1018; border-left:1px solid var(--border); font:10px/1.75 "Cascadia Mono",Consolas,monospace; color:#9fb0c8; } .sp pre .c { background:color-mix(in srgb,var(--primary) 18%,transparent); color:var(--foreground); display:block; margin:0 -14px; padding:0 14px; } .sp pre .h { color:var(--primary); }
/* 5 · brutalism */
.br { background:var(--background); height:100%; display:grid; grid-template-columns:1.4fr 1fr; grid-template-rows:auto 1fr; border-top:3px solid var(--foreground); }
.br .hero { padding:8px 12px; border-right:1px solid var(--foreground); border-bottom:1px solid var(--foreground); } .br .hero small { font-size:9px; } .br .hero .v { font:900 82px/0.95 Inter,"Segoe UI",sans-serif; letter-spacing:-.04em; }
.br .side { border-bottom:1px solid var(--foreground); padding:8px 12px; font-size:10px; } .br .side p { margin:0; display:flex; justify-content:space-between; border-bottom:1px solid var(--border); line-height:2; } .br .side b { font-weight:800; }
.br .cells { grid-column:1/-1; display:grid; grid-template-columns:repeat(4,1fr); } .br .cells div { border-right:1px solid var(--foreground); padding:8px 10px; font-size:9px; } .br .cells div:last-child { border:0; } .br .cells .v { font:800 30px/1 Inter,sans-serif; } .br .cells .x { background:var(--foreground); color:var(--background); } .br .red { color:#ff5a4e; font-weight:700; }
/* 6 · hanzi */
.hz { display:grid; grid-template-columns:230px 1fr; height:100%; } .hz svg { display:block; margin:18px; } .hz ul { list-style:none; margin:0; padding:22px 18px 0 0; font-size:11px; } .hz li { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); color:var(--muted-foreground); } .hz li i { width:10px; height:10px; background:var(--muted-foreground); } .hz li.on { color:var(--foreground); } .hz li.on i { background:#e4351e; }
.tag { position:absolute; right:8px; top:8px; z-index:10; font-size:10px; padding:1px 7px; border-radius:10px; background:var(--primary); color:#111b32; font-weight:650; }
.tag.alt { background:var(--muted); color:var(--muted-foreground); }
</style>
</head>
<body>
<h1>训练页内容区 · 六个候选</h1>
<p class="lead">每格是该候选最关键的一屏（只画内容区，外壳不变）。带「完整版」标记的三张已做成可交互的完整原型，另外三张为备选。</p>
<div class="grid">
