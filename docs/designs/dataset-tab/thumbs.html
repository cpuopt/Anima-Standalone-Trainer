<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<title>Dataset tab · six candidates</title>
<style>
.dark { --background:#10151f; --foreground:#e0e7f2; --card:#171e2b; --primary:#86aafa; --muted:#1b2434; --muted-foreground:#94a3bb; --accent:#253650; --border:#2b374c; --warn:#e8a25a; --ok:#5ace9d; }
* { box-sizing:border-box; }
body { margin:0; padding:28px; background:#0b0f16; color:var(--foreground); font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif; }
h1 { font-size:18px; font-weight:650; margin:0 0 4px; } .lead { color:var(--muted-foreground); margin:0 0 22px; font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(3,480px); gap:22px; }
figure { margin:0; } figcaption { margin-top:8px; font-size:12px; color:var(--muted-foreground); line-height:1.5; } figcaption b { color:var(--foreground); font-weight:600; }
.cell { width:480px; height:300px; overflow:hidden; border:1px solid var(--border); border-radius:8px; background:var(--background); position:relative; }
.mono { font-family:"Cascadia Mono",Consolas,monospace; font-variant-numeric:tabular-nums; }
.tag { position:absolute; right:8px; top:8px; z-index:10; font-size:10px; padding:1px 7px; border-radius:10px; background:var(--primary); color:#111b32; font-weight:650; }
.tag.alt { background:var(--muted); color:var(--muted-foreground); border:1px solid var(--border); }

/* 1 · Tufte Explorable Data-Ink & Live Pipeline */
.tf { padding:12px 15px; display:flex; flex-direction:column; gap:8px; height:100%; }
.tf-top { display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:5px; padding-right:84px; }
.tf-lbai { font-size:11px; color:var(--muted-foreground); } .tf-lbai b { font-size:17px; color:var(--foreground); font-family:"Cascadia Mono",Consolas,monospace; margin:0 3px; }
.tf-eq { font-size:8.5px; color:var(--muted-foreground); font-family:"Cascadia Mono",Consolas,monospace; } .tf-eq span { color:var(--primary); }
.tf-buck { display:grid; grid-template-columns:1.1fr 1fr; gap:10px; border-bottom:1px solid var(--border); padding-bottom:6px; font-size:10px; }
.tf-stage { display:flex; height:12px; border-radius:2px; overflow:hidden; border:1px solid var(--border); margin-top:3px; font-size:8px; line-height:10px; }
.tf-stage i { font-style:normal; text-align:center; background:color-mix(in srgb,var(--primary) 26%,transparent); color:var(--foreground); }
.tf-stage i:last-child { background:color-mix(in srgb,var(--primary) 52%,transparent); }
.tf-ds-head { display:flex; justify-content:space-between; font-size:10px; font-weight:600; color:var(--foreground); }
.tf-sub { display:grid; grid-template-columns:1.05fr 1.25fr; gap:10px; border-top:1px dotted var(--border); padding-top:6px; font-size:9.5px; }
.tf-path { font-family:"Cascadia Mono",Consolas,monospace; font-size:9.5px; color:var(--foreground); background:color-mix(in srgb,var(--card) 85%,transparent); padding:2px 5px; border-bottom:1px solid var(--primary); display:flex; justify-content:space-between; }
.tf-pipe { display:flex; gap:3px; flex-wrap:wrap; margin:3px 0 5px; }
.tf-tok { padding:1px 5px; border-radius:3px; font-size:8.5px; font-family:"Cascadia Mono",Consolas,monospace; border:1px solid var(--border); background:var(--card); }
.tf-tok.pre { border-color:var(--primary); color:var(--primary); }
.tf-tok.keep { border-color:var(--ok); color:var(--ok); }
.tf-kv { display:flex; justify-content:space-between; color:var(--muted-foreground); border-bottom:1px dotted color-mix(in srgb,var(--border) 60%,transparent); line-height:1.75; }
.tf-kv b { color:var(--foreground); font-family:"Cascadia Mono",Consolas,monospace; font-weight:500; }

/* 2 · Outliner Tree + Focused Inspector Split */
.oi { display:grid; grid-template-columns:148px 1fr; height:100%; }
.oi-tree { border-right:1px solid var(--border); background:color-mix(in srgb,var(--card) 75%,transparent); padding:10px 8px; display:flex; flex-direction:column; gap:4px; font-size:10px; }
.oi-node { padding:4px 6px; border-radius:5px; color:var(--muted-foreground); display:flex; justify-content:space-between; align-items:center; }
.oi-node.ds { font-weight:600; color:var(--foreground); margin-top:3px; }
.oi-node.sub { padding-left:14px; font-size:9.5px; }
.oi-node.on { background:var(--accent); color:var(--foreground); border:1px solid var(--border); }
.oi-pill { font-size:8px; padding:0 4px; border-radius:4px; background:var(--muted); color:var(--primary); font-family:"Cascadia Mono",Consolas,monospace; }
.oi-pill.reg { color:var(--warn); }
.oi-main { padding:30px 12px 10px; display:flex; flex-direction:column; gap:7px; }
.oi-bar { display:flex; justify-content:space-between; align-items:center; padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:var(--card); font-size:9.5px; white-space:nowrap; }
.oi-card { border:1px solid var(--border); border-radius:6px; background:var(--card); padding:7px 9px; font-size:9.5px; }
.oi-card h4 { margin:0 0 4px; font-size:10px; display:flex; justify-content:space-between; }
.oi-row { display:flex; justify-content:space-between; align-items:center; padding:3px 0; border-top:1px solid color-mix(in srgb,var(--border) 50%,transparent); }
.oi-in { font-family:"Cascadia Mono",Consolas,monospace; font-size:9px; padding:1px 6px; border:1px solid var(--border); border-radius:4px; background:var(--background); }

/* 3 · Modular Hardware Data Feeder Console */
.hw { padding:30px 11px 11px; height:100%; display:flex; flex-direction:column; gap:6px; }
.hw-meter { display:grid; grid-template-columns:104px 1fr 82px; align-items:center; gap:8px; border:1px solid var(--border); background:var(--card); padding:5px 9px; }
.hw-leds { display:grid; grid-template-columns:repeat(18,1fr); gap:2px; height:9px; }
.hw-leds i { background:var(--muted); } .hw-leds i.lit { background:var(--primary); } .hw-leds i.t { background:var(--ok); }
.hw-rack { display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--border); border-left:1px solid var(--border); }
.hw-tile { border-right:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--card); padding:5px 7px; position:relative; }
.hw-tile.s2 { grid-column:span 2; } .hw-tile.s3 { grid-column:span 3; } .hw-tile.s4 { grid-column:span 4; } .hw-tile.s6 { grid-column:span 6; }
.hw-k { font-size:8px; color:var(--muted-foreground); letter-spacing:.03em; }
.hw-v { font-family:"Cascadia Mono",Consolas,monospace; font-size:18px; font-weight:650; line-height:1.15; margin-top:2px; }
.hw-step { position:absolute; right:5px; bottom:5px; display:flex; border:1px solid var(--border); font-size:8.5px; }
.hw-step span { padding:0 4px; background:var(--background); }
.hw-bus { display:flex; align-items:center; gap:4px; font-family:"Cascadia Mono",Consolas,monospace; font-size:8.5px; margin-top:3px; color:var(--muted-foreground); }
.hw-bus b { padding:1px 5px; border:1px solid var(--border); background:var(--background); color:var(--foreground); font-weight:500; }

/* 4 · Airtable Matrix (Alternate) */
.mx { padding:28px 12px 12px; font-size:9.5px; }
.mx-top { display:flex; justify-content:space-between; margin-bottom:8px; padding:6px 8px; background:var(--card); border:1px solid var(--border); border-radius:5px; }
.mx table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--border); }
.mx th, .mx td { border:1px solid var(--border); padding:5px 6px; text-align:left; white-space:nowrap; }
.mx th { color:var(--muted-foreground); font-size:8.5px; background:var(--muted); }
.mx td { font-family:"Cascadia Mono",Consolas,monospace; font-size:9px; }

/* 5 · Roulette Web #8 Cinematic Sound-Viz Dark (Alternate) */
.sv { background:#040508; height:100%; padding:14px 16px; position:relative; display:flex; flex-direction:column; justify-content:space-between; }
.sv-title { font-size:26px; font-weight:800; line-height:1.05; letter-spacing:-.03em; z-index:2; max-width:250px; }
.sv-sub { font-size:10px; color:#8b95b0; z-index:2; margin-top:4px; }
.sv-wave { position:absolute; left:0; right:0; top:64px; height:120px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; gap:3px; opacity:.85; }
.sv-wave i { flex:1; background:linear-gradient(180deg,#8b5cf6,#3b82f6); border-radius:2px; }
.sv-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; z-index:2; }
.sv-c { background:#0c0f1a; border:1px solid #1e253d; border-radius:6px; padding:7px 8px; font-size:9px; }
.sv-c b { display:block; font-size:12px; margin:2px 0; color:#fff; }

/* 6 · Roulette East #8 Sugiura Information Mandala (Alternate) */
.md { background:#141210; color:#ece4d4; height:100%; display:grid; grid-template-columns:56px 1fr 135px; padding:12px; align-items:center; }
.md-vtitle { writing-mode:vertical-rl; font-size:20px; font-weight:800; color:#d4a94e; letter-spacing:.12em; height:240px; }
.md-side { font-size:9px; display:flex; flex-direction:column; gap:8px; }
.md-item { border-top:1px solid #3a342b; padding-top:4px; }
.md-item b { color:#d4a94e; display:block; }
</style>
</head>
