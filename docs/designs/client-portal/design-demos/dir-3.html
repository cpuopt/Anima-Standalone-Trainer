<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anima Client · 分屏交付工作舱（方向 3）</title>
<style>
  :root {
    /* 色彩推导：冷静商业交付工作面，浅灰底衬托纯白画布与深靛蓝主动作（#1E3A8A），与高彩度插画形成克制秩序 */
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --line: #e2e8f0;
    --line-strong: #cbd5e1;
    --ink: #0f172a;
    --ink-2: #475569;
    --ink-3: #64748b;
    --indigo: #1e3a8a;
    --indigo-hover: #172554;
    --indigo-soft: #eff6ff;
    --indigo-line: #bfdbfe;
    --green: #0f766e;
    --green-soft: #f0fdfa;
    --green-line: #99f6e4;
    --amber: #b45309;
    --amber-soft: #fffbeb;
    --amber-line: #fde68a;
    --thumb-size: 245px;
    --sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  img { display: block; max-width: 100%; }

  /* 顶部阶段导航栏 */
  .app-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 0 24px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .bar-left { display: flex; align-items: center; gap: 14px; }
  .logo-box {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: var(--indigo);
    color: #fff;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    display: grid;
    place-items: center;
  }
  .title-block h1 { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.25; }
  .title-block p { font-size: 12px; color: var(--ink-3); }

  /* 顶部三步履约进度条 */
  .stepper {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }
  .step {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    color: var(--ink-3);
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .step.done {
    color: var(--green);
    background: var(--green-soft);
    border-color: var(--green-line);
    font-weight: 500;
  }
  .step.current {
    color: var(--indigo);
    background: var(--indigo-soft);
    border-color: var(--indigo-line);
    font-weight: 600;
  }
  .step-sep { color: var(--line-strong); }

  /* 核心分屏骨架：左画廊 + 右 364px 常驻交付舱 */
  .split {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 364px;
    min-height: calc(100vh - 60px);
  }

  /* 左侧画廊主区 */
  .gallery-pane {
    padding: 18px 24px 72px;
    min-width: 0;
  }
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .tabs-inline {
    display: flex;
    gap: 4px;
    margin-right: auto;
    flex-wrap: wrap;
  }
  .tab-pill {
    padding: 5px 11px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--ink-2);
    min-height: 32px;
  }
  .tab-pill:hover { background: var(--bg); color: var(--ink); }
  .tab-pill.active { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; }

  .t-input, .t-select {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    min-height: 34px;
  }
  .t-input { width: 180px; }
  .t-input:focus, .t-select:focus { outline: 2px solid var(--indigo-line); border-color: var(--indigo); }
  .t-density { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
  .t-density input { width: 72px; accent-color: var(--indigo); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 0 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    transition: all 0.15s;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); border-color: #94a3b8; }
  .btn.active { background: var(--indigo-soft); color: var(--indigo); border-color: var(--indigo); }
  .btn.primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .btn.primary:hover:not(:disabled) { background: var(--indigo-hover); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .sel-banner {
    background: var(--indigo-soft);
    border: 1px solid var(--indigo-line);
    border-radius: 8px;
    padding: 9px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--indigo);
  }

  .group-wrap { margin-bottom: 22px; }
  .group-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .group-title span { font-family: var(--mono); font-size: 12px; color: var(--ink-3); font-weight: 400; }

  .img-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--thumb-size)), 1fr));
    gap: 12px;
    align-items: start;
  }
  .img-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .img-card:hover { border-color: #94a3b8; box-shadow: 0 6px 18px rgba(15,23,42,0.06); }
  .img-card.selected { border-color: var(--indigo); box-shadow: 0 0 0 2px var(--indigo-line); }
  .img-box { position: relative; background: #e2e8f0; overflow: hidden; }
  .img-box img { width: 100%; height: auto; }
  .img-chk {
    position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 5px;
    border: 1.5px solid rgba(255,255,255,0.8); background: rgba(15,23,42,0.55); color: #fff;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity 0.15s;
  }
  .selecting .img-chk, .img-card.selected .img-chk, .img-card:hover .img-chk { opacity: 1; }
  .img-card.selected .img-chk { background: var(--indigo); border-color: var(--indigo); }
  .img-dl {
    position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 6px;
    background: rgba(255,255,255,0.92); color: var(--ink); border: 1px solid var(--line);
    display: grid; place-items: center; opacity: 0; transition: opacity 0.15s; text-decoration: none;
  }
  .img-card:hover .img-dl { opacity: 1; }
  .img-dl:hover { background: var(--indigo); color: #fff; border-color: var(--indigo); }
  .img-foot {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-top: 1px solid var(--line);
  }
  .img-name { font-size: 12px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .img-tag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); background: var(--bg); padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }

  /* 右侧常驻交付资产舱 */
  .vault-pane {
    background: var(--surface);
    border-left: 1px solid var(--line);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
  }
  .vault-status {
    padding: 14px;
    border-radius: 8px;
    border: 1px solid var(--amber-line);
    background: var(--amber-soft);
  }
  .vault-status.paid {
    border-color: var(--green-line);
    background: var(--green-soft);
  }
  .vault-status h2 { font-size: 14px; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
  .vault-status.paid h2 { color: var(--green); }
  .vault-status p { font-size: 12px; color: var(--ink-2); line-height: 1.5; }

  .vault-section {
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .vault-sec-head {
    padding: 10px 14px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
  }
  .pill-lock {
    font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px;
    background: var(--bg); color: var(--ink-3); border: 1px solid var(--line-strong);
  }
  .pill-open {
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line);
  }
  .vault-sec-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .locked-msg { font-size: 12px; color: var(--ink-3); line-height: 1.55; }

  .asset-item {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 11px;
    background: var(--surface-2);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .asset-name { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); word-break: break-all; }
  .asset-meta { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
  .asset-actions { display: flex; gap: 6px; margin-top: 2px; }
  .asset-actions .btn { flex: 1; min-height: 30px; font-size: 12px; padding: 0 8px; }

  .kv-mini { display: grid; grid-template-columns: 92px 1fr; gap: 6px 8px; font-size: 12px; }
  .kv-mini span:nth-child(odd) { color: var(--ink-3); }
  .kv-mini span:nth-child(even) { font-family: var(--mono); color: var(--ink); word-break: break-all; }

  /* 灯箱 */
  .lightbox {
    position: fixed; inset: 0; z-index: 1000; background: #0f172a; color: #f8fafc;
    display: grid; grid-template-rows: 52px minmax(0, 1fr);
  }
  .lightbox.hidden { display: none; }
  .lb-bar { background: #1e293b; border-bottom: 1px solid #334155; padding: 0 14px; display: flex; align-items: center; gap: 8px; }
  .lb-bar .btn { background: #334155; border-color: #475569; color: #f8fafc; }
  .lb-bar .btn:hover:not(:disabled) { background: #475569; }
  .lb-bar .btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .lb-title { font-family: var(--mono); font-size: 13px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .lightbox.no-info .lb-body { grid-template-columns: 1fr; }
  .lb-stage-wrap { display: grid; grid-template-rows: minmax(0, 1fr) 48px; min-height: 0; }
  .lb-stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; }
  .lb-stage.dragging { cursor: grabbing; }
  .lb-stage img { position: absolute; left: 50%; top: 50%; max-width: none; max-height: none; transform-origin: 0 0; pointer-events: none; user-select: none; }
  .lb-zoom { background: #1e293b; border-top: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .lb-zoom .btn { background: #334155; border-color: #475569; color: #f8fafc; min-height: 30px; font-size: 12px; }
  .lb-zoom output { min-width: 50px; text-align: center; font-family: var(--mono); font-size: 12px; color: #cbd5e1; }
  .lb-info { background: #1e293b; border-left: 1px solid #334155; padding: 18px; overflow-y: auto; }
  .lb-info h3 { font-size: 15px; margin-bottom: 14px; }
  .lb-row { margin-bottom: 14px; }
  .lb-row label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
  .lb-row p { font-size: 13px; color: #f8fafc; word-break: break-word; }
  .lb-pre { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: #cbd5e1; }

  /* Demo 权限模拟器（左下方，避免遮挡右侧常驻交付舱） */
  .demo-dock {
    position: fixed;
    left: 20px;
    bottom: 20px;
    z-index: 900;
    background: var(--surface);
    border: 1px solid var(--indigo-line);
    border-radius: 8px;
    box-shadow: 0 12px 28px rgba(15,23,42,0.16);
    width: 304px;
    font-size: 12px;
  }
  .demo-dock.collapsed { width: auto; }
  .demo-head { padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid var(--line); background: var(--indigo-soft); color: var(--indigo); border-radius: 8px 8px 0 0; }
  .demo-dock.collapsed .demo-head { border-bottom: 0; border-radius: 8px; }
  .demo-body { padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
  .demo-dock.collapsed .demo-body { display: none; }
  .demo-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .demo-presets button { padding: 5px 4px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface-2); font-size: 11px; }
  .demo-presets button.on { background: var(--indigo); color: #fff; border-color: var(--indigo); font-weight: 600; }
  .demo-checks { display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
  .demo-checks label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .demo-checks input { accent-color: var(--indigo); width: 15px; height: 15px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 6px;
    font-size: 13px; z-index: 1200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 1024px) {
    .split { grid-template-columns: 1fr; }
    .vault-pane { position: static; height: auto; border-left: 0; border-top: 1px solid var(--line); }
    .stepper { display: none; }
    .lb-body { grid-template-columns: 1fr; }
    .lb-info { display: none; }
  }
  @media (max-width: 600px) {
    .app-bar { padding: 10px 14px; }
    .gallery-pane { padding: 12px 14px 72px; }
    .t-input { width: 100%; }
    .t-density { display: none; }
    .demo-dock { left: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<header class="app-bar">
  <div class="bar-left">
    <div class="logo-box">AC</div>
    <div class="title-block">
      <h1>星尘水彩 · Cel-Ink Atelier v2</h1>
      <p>客户交付门户 · Atelier K · #ORD-2026-1121</p>
    </div>
  </div>
  <nav class="stepper" id="stepper" aria-label="交付阶段进度"></nav>
</header>

<div class="split">
  <!-- 左侧：预览画廊工作区 -->
  <main class="gallery-pane">
    <div class="toolbar">
      <div class="tabs-inline" id="groupTabs"></div>
      <input type="search" class="t-input" id="searchInput" placeholder="搜索文件名或轮次…" aria-label="搜索预览图" />
      <select class="t-select" id="sortSelect" aria-label="排序">
        <option value="default">默认顺序</option>
        <option value="newest">最新优先</option>
        <option value="oldest">最早优先</option>
      </select>
      <label class="t-density">
        缩放
        <input type="range" id="sizeRange" min="150" max="300" value="215" aria-label="缩略图尺寸" />
      </label>
      <button class="btn" id="selectBtn">多选</button>
    </div>

    <div class="sel-banner" id="selBanner" style="display:none">
      <span>已选中 <strong id="selCount">0</strong> 张预览图</span>
      <button class="btn" id="selAllBtn">全选可见</button>
      <button class="btn" id="selClearBtn">清除</button>
      <button class="btn primary" style="margin-left:auto" id="batchDlBtn">打包下载所选预览图</button>
    </div>

    <div id="galleryBody"></div>
  </main>

  <!-- 右侧：常驻交付资产与权限舱 -->
  <aside class="vault-pane" id="vaultPane" aria-label="交付资产与权限面板"></aside>
</div>

<!-- 灯箱 -->
<section class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true">
  <header class="lb-bar">
    <button class="btn" id="lbClose">关闭</button>
    <span class="lb-title" id="lbTitle"></span>
    <button class="btn" id="lbPrev">上一张</button>
    <span style="font-family:var(--mono);font-size:12px;color:#94a3b8" id="lbCounter">1 / 6</span>
    <button class="btn" id="lbNext">下一张</button>
    <a class="btn primary" id="lbDl" download>下载原图</a>
    <button class="btn" id="lbInfoBtn">参数栏</button>
  </header>
  <div class="lb-body">
    <div class="lb-stage-wrap">
      <div class="lb-stage" id="lbStage"><img id="lbImg" alt="" draggable="false" /></div>
      <div class="lb-zoom">
        <button class="btn" id="zOut">−</button>
        <output id="zPct">100%</output>
        <button class="btn" id="zIn">＋</button>
        <button class="btn" id="zFit">适应窗口</button>
        <button class="btn" id="z100">1:1</button>
      </div>
    </div>
    <aside class="lb-info" id="lbInfo"></aside>
  </div>
</section>

<!-- 权限状态模拟器 -->
<aside class="demo-dock collapsed" id="demoDock">
  <div class="demo-head" id="demoToggle">
    <strong>原型权限模拟（评审用）</strong>
    <span id="demoArrow">展开</span>
  </div>
  <div class="demo-body">
    <div class="demo-presets">
      <button data-preset="unpaid" class="on">未付费预览</button>
      <button data-preset="lora">仅交付模型</button>
      <button data-preset="full">全权限交付</button>
    </div>
    <div class="demo-checks">
      <label><input type="checkbox" id="chkLora" /> 允许下载指定 LoRA 模型</label>
      <label><input type="checkbox" id="chkParams" /> 允许可见训练参数</label>
      <label><input type="checkbox" id="chkDataset" /> 允许下载数据集归档</label>
    </div>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
const ITEMS = [
  { id: 'cur-1', group: 'curated', groupName: '训练师精选上传', epoch: '精选', mtime: 1795240626, name: 'cel_ink_showcase_observatory.jpg', src: '../assets/sample_curated_01.jpg', size: '1024 × 1360', prompt: 'rooftop observatory at dawn, brass telescope, sheer curtains, cel-ink watercolor', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.85' },
  { id: 'p1-16', group: 'p1', groupName: 'Prompt 1 · 人物立绘', epoch: 'E16', mtime: 1795240625, name: 'cel_ink_p1_e16_lantern.jpg', src: '../assets/sample_p1_e16.jpg', size: '1024 × 1360', prompt: 'young botanical illustrator in ivory linen coat, twilight greenhouse, brass lantern', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.85' },
  { id: 'p1-12', group: 'p1', groupName: 'Prompt 1 · 人物立绘', epoch: 'E12', mtime: 1795240616, name: 'cel_ink_p1_e12_conservatory.jpg', src: '../assets/sample_p1_e12.jpg', size: '1024 × 1360', prompt: 'young botanical illustrator in ivory linen coat, sunlit glass conservatory', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.80' },
  { id: 'p2-16', group: 'p2', groupName: 'Prompt 2 · 场景光影', epoch: 'E16', mtime: 1795240645, name: 'cel_ink_p2_e16_clocktower.jpg', src: '../assets/sample_p2_e16.jpg', size: '1360 × 1024', prompt: 'old stone clocktower cobblestone alley after rain, blue hour, glowing amber cafe', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.85' },
  { id: 'p2-12', group: 'p2', groupName: 'Prompt 2 · 场景光影', epoch: 'E12', mtime: 1795240644, name: 'cel_ink_p2_e12_station.jpg', src: '../assets/sample_p2_e12.jpg', size: '1360 × 1024', prompt: 'quiet coastal train station golden hour, calm teal sea, wooden platform', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.80' },
  { id: 'p3-16', group: 'p3', groupName: 'Prompt 3 · 器物细节', epoch: 'E16', mtime: 1795240621, name: 'cel_ink_p3_e16_desk.jpg', src: '../assets/sample_p3_e16.jpg', size: '1152 × 1152', prompt: 'antique wooden desk by rainy window, open floral sketchbook, glass ink bottle', sampler: 'Euler a · 28 steps · CFG 5.5 · Weight 0.85' }
];

const state = {
  group: 'all', query: '', sort: 'default', selecting: false, selected: new Set(),
  perms: { lora: false, params: false, dataset: false },
  lbIdx: -1, lbInfo: true, zoom: 1, fit: 1, panX: 0, panY: 0, w: 0, h: 0
};
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }

function getList() {
  const q = state.query.trim().toLowerCase();
  let list = ITEMS.filter(i => (state.group === 'all' || i.group === state.group) && (!q || i.name.toLowerCase().includes(q) || i.epoch.toLowerCase().includes(q) || i.groupName.toLowerCase().includes(q)));
  if (state.sort === 'newest') list = [...list].sort((a, b) => b.mtime - a.mtime);
  if (state.sort === 'oldest') list = [...list].sort((a, b) => a.mtime - b.mtime);
  return list;
}

function renderAll() {
  const anyPaid = state.perms.lora || state.perms.params || state.perms.dataset;
  $('stepper').innerHTML = `
    <span class="step ${anyPaid ? 'done' : 'current'}">1. 成果预览验收</span>
    <span class="step-sep">/</span>
    <span class="step ${anyPaid ? 'done' : ''}">2. 付款与权限开通</span>
    <span class="step-sep">/</span>
    <span class="step ${anyPaid ? 'current' : ''}">3. 交付资产提货</span>
  `;

  const tabs = [
    { key: 'all', label: `全部 ${ITEMS.length}` },
    { key: 'curated', label: '精选上传' },
    { key: 'p1', label: 'Prompt 1' },
    { key: 'p2', label: 'Prompt 2' },
    { key: 'p3', label: 'Prompt 3' }
  ];
  $('groupTabs').innerHTML = tabs.map(t => `<button class="tab-pill ${state.group === t.key ? 'active' : ''}" data-group="${t.key}">${t.label}</button>`).join('');

  $('selectBtn').classList.toggle('active', state.selecting);
  $('selBanner').style.display = (state.selecting || state.selected.size > 0) ? 'flex' : 'none';
  $('selCount').textContent = state.selected.size;

  const list = getList();
  const grouped = new Map();
  list.forEach(item => { if (!grouped.has(item.groupName)) grouped.set(item.groupName, []); grouped.get(item.groupName).push(item); });

  const renderCards = arr => arr.map(i => `
    <article class="img-card ${state.selected.has(i.id) ? 'selected' : ''}" data-id="${i.id}">
      <div class="img-box">
        <img src="${i.src}" alt="${i.name}" loading="lazy" />
        <button class="img-chk" data-chk="${i.id}" aria-label="选择">${state.selected.has(i.id) ? '✓' : ''}</button>
        <a class="img-dl" href="${i.src}" download="${i.name}" title="下载原图" onclick="event.stopPropagation()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14"/></svg>
        </a>
      </div>
      <div class="img-foot">
        <span class="img-name" title="${i.name}">${i.groupName} · ${i.name}</span>
        <span class="img-tag">${i.epoch}</span>
      </div>
    </article>
  `).join('');

  if (!list.length) {
    $('galleryBody').innerHTML = `<p style="color:var(--ink-3);padding:48px 0;text-align:center;">未找到匹配的预览图片。</p>`;
  } else if (state.group === 'all') {
    $('galleryBody').innerHTML = `<div class="img-grid ${state.selecting ? 'selecting' : ''}">${renderCards(list)}</div>`;
  } else {
    $('galleryBody').innerHTML = [...grouped.entries()].map(([gName, arr]) => `
      <section class="group-wrap">
        <div class="group-title"><span>${gName}</span><span>${arr.length} 张</span></div>
        <div class="img-grid ${state.selecting ? 'selecting' : ''}">${renderCards(arr)}</div>
      </section>
    `).join('');
  }

  // 右侧交付舱
  $('vaultPane').innerHTML = `
    <div class="vault-status ${anyPaid ? 'paid' : ''}">
      <h2>${anyPaid ? '已进入交付提货阶段' : '当前为成果预览期'}</h2>
      <p>${anyPaid
        ? '训练师已为您开通以下权限项，可直接在本侧栏核验并下载交付文件。'
        : '您可自由放大查验并下载左侧 6 张预览图。模型权重、训练参数与数据集已隔离保护，付款确认后由训练师按项解锁。'}</p>
    </div>

    <button class="btn primary" style="width:100%" data-dl="cel_ink_atelier_v2_previews_6p.zip">打包下载全部可见预览图（6 张）</button>

    <section class="vault-section">
      <div class="vault-sec-head">
        <span>指定 LoRA 模型权重</span>
        <span class="${state.perms.lora ? 'pill-open' : 'pill-lock'}">${state.perms.lora ? '已授权 · 2 份' : '未授权'}</span>
      </div>
      <div class="vault-sec-body">
        ${state.perms.lora ? `
          <div class="asset-item">
            <div class="asset-name">cel_ink_atelier_v2_e16_final.safetensors</div>
            <div class="asset-meta"><span>Epoch 16 · 推荐终版</span><span>148.2 MiB · BF16</span></div>
            <div class="asset-actions">
              <button class="btn" data-copy="a94c8f12e0b74d91a2">复制 SHA256</button>
              <button class="btn primary" data-dl="cel_ink_atelier_v2_e16_final.safetensors">下载权重</button>
            </div>
          </div>
          <div class="asset-item">
            <div class="asset-name">cel_ink_atelier_v2_e12_soft.safetensors</div>
            <div class="asset-meta"><span>Epoch 12 · 柔和泛化版</span><span>148.2 MiB · BF16</span></div>
            <div class="asset-actions">
              <button class="btn" data-copy="71b0e4c9f82a88c310">复制 SHA256</button>
              <button class="btn" data-dl="cel_ink_atelier_v2_e12_soft.safetensors">下载权重</button>
            </div>
          </div>
        ` : `<p class="locked-msg">预览阶段绝对不暴露模型文件链接。确认成果并完成结算后，训练师将在后台为您指定可下载的权重版本。</p>`}
      </div>
    </section>

    <section class="vault-section">
      <div class="vault-sec-head">
        <span>训练参数配置</span>
        <span class="${state.perms.params ? 'pill-open' : 'pill-lock'}">${state.perms.params ? '只读已开' : '已隐藏'}</span>
      </div>
      <div class="vault-sec-body">
        ${state.perms.params ? `
          <div class="kv-mini">
            <span>基础模型</span><span>Anima-v1.5-Preview</span>
            <span>网络结构</span><span>LoRA · Dim 32 / Alpha 16</span>
            <span>学习率</span><span>1e-4 (UNet) · Cosine</span>
            <span>轮次/步数</span><span>16 Epochs · 2,400 Steps</span>
            <span>分辨率/精度</span><span>1024×1024 ARB · BF16</span>
            <span>触发词</span><span>cel_ink_atelier</span>
          </div>
          <button class="btn" id="copyParamsBtn">复制完整参数摘要</button>
        ` : `<p class="locked-msg">训练配置参数当前不可见。若您的订单包含参数交付项，开通权限后将在此处以只读方式展示。</p>`}
      </div>
    </section>

    <section class="vault-section">
      <div class="vault-sec-head">
        <span>数据集归档包</span>
        <span class="${state.perms.dataset ? 'pill-open' : 'pill-lock'}">${state.perms.dataset ? '可下载' : '未授权'}</span>
      </div>
      <div class="vault-sec-body">
        ${state.perms.dataset ? `
          <div class="asset-item">
            <div class="asset-name">cel_ink_atelier_dataset_v2.zip</div>
            <div class="asset-meta"><span>128 张素材 · 100% 标注</span><span>412.6 MiB</span></div>
            <div class="asset-actions">
              <button class="btn primary" data-dl="cel_ink_atelier_dataset_v2.zip">下载数据集归档</button>
            </div>
          </div>
        ` : `<p class="locked-msg">训练数据集目录当前不对外开放。如需同步交付清洗后的图文标注包，请联系训练师开通此项权限。</p>`}
      </div>
    </section>
  `;
}

/* 灯箱 */
function applyT() {
  const img = $('lbImg');
  img.style.width = state.w + 'px'; img.style.height = state.h + 'px';
  img.style.transform = `translate(${state.panX - state.w * state.zoom / 2}px, ${state.panY - state.h * state.zoom / 2}px) scale(${state.zoom})`;
  $('zPct').textContent = Math.round(state.zoom * 100) + '%';
}
function fitLB() {
  const st = $('lbStage');
  if (!st || !state.w || !state.h) return;
  state.fit = Math.min((st.clientWidth - 28) / state.w, (st.clientHeight - 28) / state.h);
  state.zoom = state.fit; state.panX = 0; state.panY = 0; applyT();
}
function zoomLB(f, cx, cy) {
  const st = $('lbStage'), prev = state.zoom;
  state.zoom = Math.max(state.fit * 0.25, Math.min(8, state.zoom * f));
  const x = (cx ?? st.clientWidth / 2) - st.clientWidth / 2;
  const y = (cy ?? st.clientHeight / 2) - st.clientHeight / 2;
  state.panX = x - (x - state.panX) * state.zoom / prev;
  state.panY = y - (y - state.panY) * state.zoom / prev;
  applyT();
}
function openLB(id) {
  const list = getList(); state.lbIdx = list.findIndex(i => i.id === id);
  if (state.lbIdx < 0) return;
  renderLB(); $('lightbox').classList.remove('hidden'); document.body.style.overflow = 'hidden';
}
function closeLB() { $('lightbox').classList.add('hidden'); document.body.style.overflow = ''; }
function renderLB() {
  const list = getList(), i = list[state.lbIdx]; if (!i) return;
  $('lbTitle').textContent = i.name;
  $('lbCounter').textContent = `${state.lbIdx + 1} / ${list.length}`;
  $('lbPrev').disabled = state.lbIdx <= 0;
  $('lbNext').disabled = state.lbIdx >= list.length - 1;
  $('lbDl').href = i.src; $('lbDl').download = i.name;
  const img = $('lbImg');
  img.onload = () => { state.w = img.naturalWidth; state.h = img.naturalHeight; fitLB(); };
  img.src = i.src;
  if (img.complete && img.naturalWidth) { state.w = img.naturalWidth; state.h = img.naturalHeight; fitLB(); }

  $('lightbox').classList.toggle('no-info', !state.lbInfo);
  $('lbInfo').innerHTML = `
    <h3>预览图信息</h3>
    <div class="lb-row"><label>分组</label><p>${i.groupName}</p></div>
    <div class="lb-row"><label>轮次</label><p style="font-family:var(--mono)">${i.epoch}</p></div>
    <div class="lb-row"><label>分辨率</label><p style="font-family:var(--mono)">${i.size}</p></div>
    <div class="lb-row">
      <label>生成参数</label>
      ${state.perms.params ? `<pre class="lb-pre">${i.prompt}\n\n${i.sampler}</pre>` : `<p style="color:#94a3b8;font-size:12px">未授权「可见训练参数」，此处已隐藏。</p>`}
    </div>
  `;
}

$('groupTabs').addEventListener('click', e => { const b = e.target.closest('[data-group]'); if (b) { state.group = b.dataset.group; renderAll(); } });
$('searchInput').addEventListener('input', e => { state.query = e.target.value; renderAll(); });
$('sortSelect').addEventListener('change', e => { state.sort = e.target.value; renderAll(); });
$('sizeRange').addEventListener('input', e => document.documentElement.style.setProperty('--thumb-size', e.target.value + 'px'));
$('selectBtn').addEventListener('click', () => { state.selecting = !state.selecting; renderAll(); });
$('selAllBtn').addEventListener('click', () => { getList().forEach(i => state.selected.add(i.id)); renderAll(); });
$('selClearBtn').addEventListener('click', () => { state.selected.clear(); renderAll(); });
$('batchDlBtn').addEventListener('click', () => { if (state.selected.size) toast(`已触发 ${state.selected.size} 张预览原图批量下载`); });

$('galleryBody').addEventListener('click', e => {
  const chk = e.target.closest('[data-chk]');
  if (chk) { e.stopPropagation(); const id = chk.dataset.chk; state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); renderAll(); return; }
  const card = e.target.closest('.img-card');
  if (!card) return;
  const id = card.dataset.id;
  if (state.selecting || e.ctrlKey || e.metaKey) { state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); renderAll(); }
  else openLB(id);
});
$('vaultPane').addEventListener('click', e => {
  const dl = e.target.closest('[data-dl]');
  if (dl) { toast(`开始下载授权文件：${dl.dataset.dl}`); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).catch(() => {}); toast('SHA-256 已复制'); return; }
  if (e.target.id === 'copyParamsBtn') toast('训练参数摘要已复制');
});

$('lbClose').addEventListener('click', closeLB);
$('lbPrev').addEventListener('click', () => { if (state.lbIdx > 0) { state.lbIdx--; renderLB(); } });
$('lbNext').addEventListener('click', () => { if (state.lbIdx < getList().length - 1) { state.lbIdx++; renderLB(); } });
$('lbInfoBtn').addEventListener('click', () => { state.lbInfo = !state.lbInfo; renderLB(); setTimeout(fitLB, 20); });
$('zIn').addEventListener('click', () => zoomLB(1.25));
$('zOut').addEventListener('click', () => zoomLB(0.8));
$('zFit').addEventListener('click', fitLB);
$('z100').addEventListener('click', () => { state.zoom = 1; state.panX = 0; state.panY = 0; applyT(); });

const st = $('lbStage');
let drag = false, sx = 0, sy = 0, ox = 0, oy = 0;
st.addEventListener('wheel', e => { e.preventDefault(); const r = st.getBoundingClientRect(); zoomLB(Math.exp(-Math.max(-120, Math.min(120, e.deltaY)) * 0.002), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
st.addEventListener('pointerdown', e => { if (e.button !== 0) return; drag = true; sx = e.clientX; sy = e.clientY; ox = state.panX; oy = state.panY; st.setPointerCapture(e.pointerId); st.classList.add('dragging'); });
st.addEventListener('pointermove', e => { if (!drag) return; state.panX = ox + e.clientX - sx; state.panY = oy + e.clientY - sy; applyT(); });
st.addEventListener('pointerup', () => { drag = false; st.classList.remove('dragging'); });
st.addEventListener('dblclick', fitLB);
document.addEventListener('keydown', e => {
  if ($('lightbox').classList.contains('hidden')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft' && state.lbIdx > 0) { state.lbIdx--; renderLB(); }
  if (e.key === 'ArrowRight' && state.lbIdx < getList().length - 1) { state.lbIdx++; renderLB(); }
  if (e.key === '+' || e.key === '=') zoomLB(1.25);
  if (e.key === '-') zoomLB(0.8);
  if (e.key === '0') fitLB();
});

function syncDemo() {
  $('chkLora').checked = state.perms.lora;
  $('chkParams').checked = state.perms.params;
  $('chkDataset').checked = state.perms.dataset;
  document.querySelectorAll('.demo-presets button').forEach(b => b.classList.remove('on'));
  if (!state.perms.lora && !state.perms.params && !state.perms.dataset) document.querySelector('[data-preset="unpaid"]').classList.add('on');
  else if (state.perms.lora && !state.perms.params && !state.perms.dataset) document.querySelector('[data-preset="lora"]').classList.add('on');
  else if (state.perms.lora && state.perms.params && state.perms.dataset) document.querySelector('[data-preset="full"]').classList.add('on');
  renderAll();
  if (!$('lightbox').classList.contains('hidden')) renderLB();
}
$('demoToggle').addEventListener('click', () => {
  const d = $('demoDock'); d.classList.toggle('collapsed');
  $('demoArrow').textContent = d.classList.contains('collapsed') ? '展开' : '收起';
});
document.querySelectorAll('.demo-presets button').forEach(b => b.addEventListener('click', () => {
  const p = b.dataset.preset;
  if (p === 'unpaid') state.perms = { lora: false, params: false, dataset: false };
  if (p === 'lora') state.perms = { lora: true, params: false, dataset: false };
  if (p === 'full') state.perms = { lora: true, params: true, dataset: true };
  syncDemo();
}));
$('chkLora').addEventListener('change', e => { state.perms.lora = e.target.checked; syncDemo(); });
$('chkParams').addEventListener('change', e => { state.perms.params = e.target.checked; syncDemo(); });
$('chkDataset').addEventListener('change', e => { state.perms.dataset = e.target.checked; syncDemo(); });

renderAll();
</script>
</body>
</html>
